[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Service Root Directory in Railway UI must be empty (repo root).
# If set to backend/, the build cannot COPY frontend/ or scripts/docker-entrypoint.sh.

# Default service: Studio web (Daphne). Add worker + beat services in Railway - see deploy/RAILWAY-SERVICES.md.
# Each service uses the same image; set PROCESS_TYPE per service (web | worker | beat).
# Do not set a custom Start Command in Railway — ENTRYPOINT runs collectstatic, migrate, then Daphne.

[deploy]
# No healthcheckPath here: this file is shared by web, worker and beat, and Celery
# processes never serve HTTP. The /health/ check (timeout 180s) is set on the
# operations-studio-web service itself in Railway settings.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
